name: Release

# 构建和发布都在这个公开仓里跑：GitHub Actions 的免费额度只认 workflow 所在的
# 仓库，所以把私仓 nt_helper 的源码用 PAT 浅克隆过来，在公开仓的 runner 上编译，
# 不消耗私有仓的 3000 分钟 / 月。
#
# 日志对所有人可见。私有源码的编译/测试输出只保留在临时 runner，不打印或上传；
# 公开资产使用显式白名单，禁止源码、调试符号和诊断日志混入。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: nt_helper 的分支 / 标签 / commit
        required: false
        default: main
      preflight_only:
        description: 仅构建与验证，不创建或上传 Release
        type: boolean
        default: false

permissions:
  contents: write

env:
  SOURCE_REPO: weq-devs/nt_helper
  RELEASE_REPO: weq-devs/nt_helper_release

jobs:
  validate:
    name: Validate public release contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --test test/*.test.mjs

  # 先把源码 ref 解析成具体 commit，再开一个 draft release。五个 matrix job 都
  # 往这个 draft 上挂资产（跨 job 没有 artifact，也就没有那种"存一份中转、发完
  # 再删"的配额问题，更不会互相看见半成品）。
  prepare:
    name: Open draft release
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      source_sha: ${{ steps.tag.outputs.source_sha }}
      build_timestamp: ${{ steps.tag.outputs.build_timestamp }}
    steps:
      # tag 里带构建日期与 commit 短 sha，方便 release 里回头查是谁编的。
      # 同一天对同一个 commit 重跑会撞 tag（比如上次构建抖动），撞了依次补
      # run number / 时间戳，保证一定拿到一个没人占的名字。
      - name: Pick tag + create draft
        id: tag
        env:
          GH_TOKEN: ${{ secrets.NT_HELPER_TOKEN }}
          SOURCE_REF: ${{ inputs.ref }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
        run: |
          set -euo pipefail
          SOURCE_SHA=$(gh api "repos/$SOURCE_REPO/commits/$SOURCE_REF" --jq .sha)
          echo "source sha: $SOURCE_SHA"
          BASE="nt-helper-$(date -u +%Y%m%d)-$(printf '%s' "$SOURCE_SHA" | cut -c1-7)"
          TAG="$BASE"
          if gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            TAG="$BASE-r$GITHUB_RUN_NUMBER"
          fi
          if gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            TAG="$BASE-r$GITHUB_RUN_NUMBER-$(date -u +%s)"
          fi
          # draft 不会在发布仓里建出真正的 git tag（转正时才建），所以取消 / 失败
          # 的 run 不会留下一堆垃圾 tag，下面 cleanup 再把 draft release 收掉。
          if [ "$PREFLIGHT_ONLY" != "true" ]; then
            gh release create "$TAG" \
              --repo "$RELEASE_REPO" \
              --draft \
              --title "nt_helper $TAG" \
              --notes "nt_helper 原生产物自动发布（来源 $SOURCE_REPO@$SOURCE_SHA，run $GITHUB_RUN_ID）。产物由 matrix job 直接上传，全部到齐后转正。"
          fi
          {
            echo "tag=$TAG"
            echo "source_sha=$SOURCE_SHA"
            echo "build_timestamp=$(date +%s)"
          } >> "$GITHUB_OUTPUT"
          if [ "$PREFLIGHT_ONLY" = "true" ]; then
            echo "preflight only: no Release created"
          else
            echo "draft release: $TAG"
          fi

  build:
    name: Build Rust Binary
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: nt_helper-win32-x64
            dress: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: nt_helper-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: nt_helper-linux-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: nt_helper-darwin-x64
          - os: macos-15
            target: aarch64-apple-darwin
            asset: nt_helper-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      # 浅克隆私仓，pin 到 prepare 解析出的那个 commit。persist-credentials 关掉，
      # 免得 PAT 留在 .git/config 里被后面操作发布仓的步骤顺手带上。
      - name: Checkout nt_helper (private source)
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          token: ${{ secrets.NT_HELPER_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout public release tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false

      # SQLCipher amalgamation 带了一处 WeQ 补丁（QQ 的 pending byte 与
      # 绝对锁字节解耦）。vendor 漂移会让 1GiB 修复悄悄消失，所以发版前
      # 在 linux-x64 这一份上校验一次即可。
      - name: Verify vendored SQLCipher patch
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          if ! bash scripts/check-libsqlite3-sys-fork.sh > "$RUNNER_TEMP/vendor-check.log" 2>&1; then
            echo "::error::Vendored SQLCipher patch verification failed; private diagnostics are not published."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          architecture: ${{ startsWith(matrix.target, 'aarch64-') && 'arm64' || 'x64' }}

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install openssl:x64-windows-static
          echo "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static" >> $env:GITHUB_ENV
          echo "OPENSSL_NO_VENDOR=1" >> $env:GITHUB_ENV

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config perl make flex bison curl ca-certificates

      # 静态链接 libpcap（抓包模块）。发行版自带的 `libpcap.a` **不是 -fPIC**，
      # 链进 `-pie` 的 .node 会出现 relocation 错误；所以从源码构建一个禁掉
      # libnl/dbus/rdma/bluetooth/usb/netmap 等可选后端的最小静态库，再用
      # `LIBPCAP_LIBDIR` 让 pcap crate 静态链接（产物自包含，不依赖用户机器上的
      # libpcap.so.*）。x64 / arm64 均在原生 runner 构建，随后实际执行构建信息检查。
      - name: Build static libpcap (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://www.tcpdump.org/release/libpcap-1.10.4.tar.gz -o /tmp/libpcap.tar.gz
          tar xzf /tmp/libpcap.tar.gz -C /tmp
          cd /tmp/libpcap-1.10.4
          ./configure --disable-shared --without-libnl --disable-dbus \
            --disable-rdma --disable-bluetooth --disable-usb --disable-netmap \
            CC=gcc CFLAGS=-fPIC
          make -j"$(nproc)"
          mkdir -p "$GITHUB_WORKSPACE/.libpcap-static"
          cp libpcap.a "$GITHUB_WORKSPACE/.libpcap-static/"
          echo "LIBPCAP_LIBDIR=$GITHUB_WORKSPACE/.libpcap-static" >> "$GITHUB_ENV"
          echo "LIBPCAP_VER=1.10.4" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install NAPI CLI
        run: npm install

      - name: Build Release
        shell: bash
        env:
          # Derive the dress bundle AES key from the source commit, so all five
          # platform builds in this run share one key and any of the resulting
          # .dat sets can be read by every platform's nt_helper.node.
          DRESS_KEY_SEED: ${{ needs.prepare.outputs.source_sha }}
          BUILD_TIMESTAMP: ${{ needs.prepare.outputs.build_timestamp }}
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          AUTHORIZATION_OUTPUT_DIR: out
        run: |
          set -euo pipefail
          # 不公开 cargo 的源码诊断片段，也不把这些日志作为 artifact 上传。
          if ! npm run build -- --target "${{ matrix.target }}" > "$RUNNER_TEMP/native-build.log" 2>&1; then
            echo "::error::Native addon build failed; private diagnostics are not published."
            exit 1
          fi
          if ! node scripts/build-authorization-helper.mjs > "$RUNNER_TEMP/helper-build.log" 2>&1; then
            echo "::error::Native helper build failed; no helper assets will be published."
            exit 1
          fi

      - name: Test restricted native helper
        shell: bash
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: |
          set -euo pipefail
          if ! cargo test --locked --target "${{ matrix.target }}" -p weq-authorization-helper -j 2 > "$RUNNER_TEMP/helper-tests.log" 2>&1; then
            echo "::error::Native helper synthetic tests failed; private diagnostics are not published."
            exit 1
          fi
          if ! node --test scripts/build-authorization-helper.test.mjs > "$RUNNER_TEMP/helper-cli-tests.log" 2>&1; then
            echo "::error::Helper build-mode guards failed; private diagnostics are not published."
            exit 1
          fi

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          nodes=( *.node )
          echo "构建产出：${nodes[*]:-(无)}"
          if [ ${#nodes[@]} -ne 1 ]; then
            echo "::error::构建必须恰好产出一个 *.node"
            exit 1
          fi
          # napi 按 target 命名（nt_helper.<target>.node）；发布名与 WeQ 的
          # scripts/fetch-native.mjs 对齐，统一成 nt_helper-<platform>.node。
          cp "${nodes[0]}" "out/${{ matrix.asset }}.node"
          ls -lh out

      - name: Verify native pair without elevation or QQ
        shell: bash
        run: |
          platform="${{ matrix.asset }}"
          node .release-tools/scripts/verify-platform.mjs out "${platform#nt_helper-}" "${{ needs.prepare.outputs.build_timestamp }}"

      - name: Verify helper runtime dependencies (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          platform="${{ matrix.asset }}"
          helper="out/weq-authorization-helper-${platform#nt_helper-}"
          if [ "$RUNNER_OS" = "Linux" ]; then
            dependencies=$(ldd "$helper")
            if printf '%s\n' "$dependencies" | grep -Ei 'lib(pcap|ssl|crypto|sqlite|node)|electron'; then
              echo "::error::Helper includes a forbidden non-system runtime dependency"
              exit 1
            fi
          else
            dependencies=$(otool -L "$helper" | tail -n +2 | awk '{print $1}')
            if printf '%s\n' "$dependencies" | grep -Ev '^(/usr/lib/|/System/Library/)'; then
              echo "::error::Helper dependency is outside macOS system libraries"
              exit 1
            fi
          fi

      - name: Verify helper runtime dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products '*' -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin is required for helper release verification' }
          $dependencies = & $dumpbin /DEPENDENTS out/weq-authorization-helper-win32-x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect helper dependencies' }
          if ($dependencies -match '(?i)(VCRUNTIME|MSVCP|libssl|libcrypto|sqlite|node\.dll|electron)') { throw 'Helper contains an unexpected runtime dependency' }

      - name: Upload binary to draft release
        if: ${{ !inputs.preflight_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "out/${{ matrix.asset }}.node" \
            --repo "$RELEASE_REPO" --clobber
          platform="${{ matrix.asset }}"
          platform="${platform#nt_helper-}"
          helper="out/weq-authorization-helper-$platform"
          if [ "$RUNNER_OS" = "Windows" ]; then helper="$helper.exe"; fi
          gh release upload "$TAG" "$helper" "out/authorization-$platform.json" \
            --repo "$RELEASE_REPO" --clobber
          echo "uploaded ${{ matrix.asset }}.node to draft $TAG"

      # 装扮资源三个平台共用同一份（DRESS_KEY_SEED=源码 commit 派生同一个 AES key），
      # 只需要传一次 —— 早先每个平台各传一份，5 份里 4 份是纯浪费。
      - name: Verify dress resources
        if: matrix.dress
        shell: bash
        run: |
          for part in bubble widget font; do
            test -s "resources/dress/$part.dat" || exit 1
          done

      - name: Upload dress resources to draft release
        if: ${{ matrix.dress && !inputs.preflight_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          args=()
          for part in bubble widget font; do
            src="resources/dress/$part.dat"
            if [ ! -f "$src" ]; then
              echo "::error::装扮资源缺失：$src"
              exit 1
            fi
            cp "$src" "out/dress-$part.dat"
            args+=("out/dress-$part.dat")
          done
          gh release upload "$TAG" "${args[@]}" \
            --repo "$RELEASE_REPO" --clobber
          ls -lh out/dress-*.dat

  # 补上 manifest.json / SHA256SUMS，然后把 draft 转正、更新 latest.json。
  publish:
    name: Publish to nt_helper_release
    needs: [prepare, build]
    if: ${{ !inputs.preflight_only }}
    runs-on: ubuntu-latest
    steps:
      # 拿发布仓的 main，后面提交 latest.json 用。
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --repo "$RELEASE_REPO" --dir dist --clobber
          ls -lh dist

      - name: Stage manifest + SHA256SUMS
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          BUILD_TIMESTAMP: ${{ needs.prepare.outputs.build_timestamp }}
        run: node scripts/stage-manifest.mjs dist

      - name: Upload manifest + SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/manifest.json dist/SHA256SUMS \
            --repo "$RELEASE_REPO" --clobber
          # 片段只供 draft 汇总；最终只保留二进制与总清单，避免多余公开资产。
          for platform in win32-x64 linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            gh release delete-asset "$TAG" "authorization-$platform.json" --repo "$RELEASE_REPO" --yes
          done

      # 到这里资产已齐、manifest 已校验，把 draft 转正。draft 期间发布仓里没有
      # 真正的 tag，也不会被 WeQ 的 releases/latest 看到，所以上面任何一步挂了
      # 都只是留下一个半成品草稿，不会污染"最新版本"。
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          cat > NOTES.md <<'EOF'
          nt_helper 原生产物的自动发布（来源 weq-devs/nt_helper）。

          - 5 个平台的 `nt_helper.node`
          - 5 个平台的小型原生权限助手（不含 Node/Electron，需显式安装授权）
          - 装扮离线资源 `bubble/widget/font.dat`（AES key 由本次构建 commit 派生，只与同一 tag 的 `.node` 配套）
          - `manifest.json` / `SHA256SUMS`

          WeQ 侧用 `pnpm native:fetch` 取用。二进制自身带有效期，发版前记得取最新的那份。
          EOF
          # 构建 / 过期时间直接取 manifest 里那两个字段（源头是 .node 自报的
          # getBuildInfo，天数只在 Rust 里定义一处）。
          node -e '
            const fs = require("node:fs");
            const m = JSON.parse(fs.readFileSync("dist/manifest.json", "utf8"));
            const lines = ["", `- 构建时间：${m.buildTime ?? "未知"}`, `- 有效期至：${m.expiresAt ?? "未知"}`];
            fs.appendFileSync("NOTES.md", lines.join("\n") + "\n");
          '
          gh release edit "$TAG" \
            --repo "$RELEASE_REPO" \
            --draft=false \
            --latest \
            --notes-file NOTES.md
          echo "published https://github.com/$RELEASE_REPO/releases/tag/$TAG"

      # 让 releases/latest/download/manifest.json 这个稳定 URL 跟着走：把同一份
      # manifest 提交成 main 分支的 latest.json（人肉 diff 也方便）。
      #
      # 用 github-actions[bot] 的固定数字 id 做署名；GITHUB_TOKEN 推的提交不会
      # 触发新的 workflow，所以这里不会自己套娃。
      - name: Update latest.json on main
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          cp dist/manifest.json latest.json
          git add latest.json
          if git diff --cached --quiet; then
            echo "latest.json 没变化，跳过提交"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "chore: publish $TAG"
            git push
          fi

  # 构建 / 发布挂了就把草稿收掉，别让半成品在发布仓里越堆越多。草稿转正后
  # （publish 成功）这里不会跑。
  cleanup-draft:
    name: Clean up draft on failure
    needs: [prepare, build, publish]
    if: always() && !inputs.preflight_only && needs.prepare.result == 'success' && needs.publish.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Delete draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -uo pipefail
          # 草稿没有 git tag，`--cleanup-tag` 会在删完 release 后因为"tag 不存在"
          # 报 422 —— 命令返回值不可信，直接用"还查不查得到"来判定是否删干净。
          gh release delete "$TAG" --repo "$RELEASE_REPO" --yes --cleanup-tag >/dev/null 2>&1 || true
          if gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$RELEASE_REPO" --yes >/dev/null 2>&1 || true
          fi
          if gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            echo "::warning::草稿 $TAG 没能自动清掉，去发布仓手动删一下"
          else
            echo "deleted draft $TAG"
          fi
